<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123d32"><title>المقال | ناصر بوطيب</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script></head><body><div class="topbar"><div class="wrap"><span>الموقع الرسمي · الفتاوى والبحوث الإسلامية</span><span><a href="https://wa.me/201060774432" target="_blank" rel="noopener">واتساب</a><a href="https://www.facebook.com/nasr.s.yd.bwal.asy" target="_blank" rel="noopener">فيسبوك</a></span></div></div><header><div class="header-inner"><a class="brand" href="index.html"><span class="logo">۞</span><span><strong class="brand-name">ناصر بوطيب</strong><small class="brand-tag">الموقع الرسمي · للأسئلة والأجوبة والبحوث الإسلامية</small></span></a><nav><a href="index.html">الرئيسية</a><a href="index.html#categories">الأقسام</a></nav></div></header><main><article class="side-card" style="max-width:900px;margin:25px auto;padding:clamp(18px,4vw,38px)"><a class="text-link" href="index.html">← العودة إلى الموقع</a><div id="meta" class="meta" style="margin-top:20px"></div><h1 id="title" style="color:var(--green);font-size:clamp(25px,4vw,34px)">جارٍ تحميل الموضوع...</h1><div id="body" class="article-body"></div><div class="article-actions"><button class="outline" id="copyBtn">نسخ الإجابة</button><button class="outline" id="shareBtn">مشاركة</button><button class="outline" onclick="window.print()">طباعة</button></div><div class="notice">ينبغي مراجعة الإجابات وتوثيق مصادرها قبل اعتمادها للنشر العام.</div></article></main><script src="config.js"></script><script>
const demo={"demo-1":{title:"ما أهمية الإخلاص في العبادة؟",category:"العقيدة",summary:"الإخلاص هو أن يقصد المسلم بعمله وجه الله تعالى.",body:"<p>الإخلاص من المعاني الأساسية في العبادة، ومعناه أن يقصد الإنسان بعبادته رضا الله تعالى.</p><h2>دليل من القرآن</h2><p>قال الله تعالى: ﴿وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ﴾ [البينة: 5].</p><div class='source'>المصدر: القرآن الكريم، سورة البينة، الآية 5. المثال تعليمي ويُراجع قبل النشر.</div>"},"demo-2":{title:"كيف يحافظ المسلم على الصلاة في وقتها؟",category:"الفقه والعبادات",summary:"وسائل عملية للمحافظة على الصلاة.",body:"<p>المحافظة على الصلاة تحتاج إلى عزم وأخذ بالأسباب، ومنها معرفة المواقيت الموثوقة والاستعداد للصلاة.</p>"},"demo-3":{title:"كيف نتحقق من صحة حديث منتشر على الإنترنت؟",category:"الحديث",summary:"التحقق من تخريج الحديث وحكم أهل الاختصاص.",body:"<p>الأفضل عدم نشر الحديث قبل التحقق من مصدره وحكم العلماء عليه.</p>"}};
const san=h=>window.DOMPurify?DOMPurify.sanitize(h):String(h).replace(/</g,"&lt;");
(async()=>{const id=new URLSearchParams(location.search).get("id");const c=window.SITE_CONFIG||{};const live=!!(c.supabaseUrl&&c.supabaseAnonKey&&window.supabase);let a=live?null:demo[id];if(live){try{const s=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const {data}=await s.from("articles").select("*").eq("id",id).eq("status","published").maybeSingle();if(data)a=data}catch(e){}}if(!a){document.getElementById("title").textContent="الموضوع غير موجود";document.getElementById("body").textContent="قد يكون الرابط غير صحيح أو أن الموضوع غير منشور.";return}document.title=a.title+" | ناصر بوطيب";document.getElementById("title").textContent=a.title;const E=s=>String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));const TY={fatwa:"فتوى منقولة عن عالم",article:"مقالة تفسيرية",research:"بحث علمي",reply:"رد علمي"};
document.getElementById("meta").innerHTML=(/^\d+$/.test(String(a.id))?"<span class='num'>رقم "+E(a.id)+"</span>":"")+"<span class='pill'>"+E(a.category)+"</span>"+(TY[a.content_type]?"<span class='pill alt'>"+TY[a.content_type]+"</span>":"")+(a.review_status==="reviewed"?"<span class='pill'>روجعت</span>":"")+(a.author?"<span>"+E(a.author)+"</span>":"");
let h=a.question_text?"<div class='source'><strong>السؤال:</strong> "+E(a.question_text)+"</div>":"";h+=san(a.body||"<p>"+E(a.summary||"")+"</p>");
if(a.sources){h+="<h2>المصادر والمراجع</h2><ul class='sources'>"+a.sources.split("\n").filter(x=>x.trim()).map(x=>"<li>"+E(x)+"</li>").join("")+"</ul>"}
document.getElementById("body").innerHTML=h;
const vu=String(a.video_url||"");if(/^https?:\/\//i.test(vu)){let m,s;
if(m=vu.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/))s='<iframe src="https://www.youtube.com/embed/'+m[1]+'" allowfullscreen loading="lazy"></iframe>';
else if(m=vu.match(/vimeo\.com\/(\d+)/))s='<iframe src="https://player.vimeo.com/video/'+m[1]+'" allowfullscreen loading="lazy"></iframe>';
else if(/facebook\.com|fb\.watch/i.test(vu))s='<iframe src="https://www.facebook.com/plugins/video.php?show_text=false&href='+encodeURIComponent(vu)+'" allowfullscreen loading="lazy"></iframe>';
else s='<video controls playsinline preload="metadata" src="'+E(vu)+'"></video>';
document.getElementById("body").insertAdjacentHTML("afterbegin",'<div class="video-box">'+s+'</div>')}
[["description",(a.summary||"").slice(0,160)],["og:title",a.title],["og:description",(a.summary||"").slice(0,160)]].forEach(([k,v])=>{const m=document.createElement("meta");m.setAttribute(k==="description"?"name":"property",k);m.content=v;document.head.appendChild(m)});
document.getElementById("copyBtn").onclick=async()=>{try{await navigator.clipboard.writeText(a.title+"\n\n"+document.getElementById("body").innerText);alert("تم النسخ")}catch(e){alert("تعذر النسخ تلقائيًا؛ حدّد النص وانسخه يدويًا")}};document.getElementById("shareBtn").onclick=async()=>{try{if(navigator.share)await navigator.share({title:a.title,url:location.href});else prompt("انسخ رابط الموضوع",location.href)}catch(e){}}})();
</script></body></html>
