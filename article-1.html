<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16264d"><title>المقال | ناصر بوطيب</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>.video-box{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin:0 0 18px}.video-box iframe,.video-box video{position:absolute;inset:0;width:100%;height:100%;border:0}</style></head>
<body>
<div class="topbar"><div class="wrap"><span>الموقع الدعوي الرسمي</span><span><a href="https://wa.me/201060774432" target="_blank" rel="noopener">واتساب</a><a href="https://www.facebook.com/nasr.s.yd.bwal.asy" target="_blank" rel="noopener">فيسبوك</a></span></div></div>
<header><div class="header-inner"><a class="brand" href="index.html"><span class="logo">۞</span><span><strong class="brand-name">ناصر بوطيب</strong><small class="brand-tag">الموقع الدعوي الرسمي</small></span></a><nav><a href="index.html">الرئيسية</a><a href="index.html#categories">الأقسام</a></nav></div></header>
<main><article class="side-card" style="max-width:900px;margin:25px auto;padding:clamp(18px,4vw,38px)">
<a class="text-link" href="index.html">← العودة إلى الموقع</a><div id="meta" class="meta" style="margin-top:20px"></div>
<h1 id="title" style="color:var(--green);font-size:clamp(25px,4vw,34px)">جارٍ تحميل الموضوع...</h1><div id="body" class="article-body"></div>
<div class="article-actions"><button class="outline" id="copyBtn">نسخ الإجابة</button><button class="outline" id="shareBtn">مشاركة</button><button class="outline" id="printBtn">طباعة</button></div>
<div class="notice">ينبغي مراجعة الإجابات وتوثيق مصادرها قبل اعتمادها للنشر العام.</div>
</article></main>
<script src="config.js"></script>
<script>
const demos = {
"demo-1":{title:"ما أهمية الإخلاص في العبادة؟",category:"العقيدة والتوحيد",summary:"الإخلاص هو أن يقصد المسلم بعمله وجه الله تعالى.",body:"<p>الإخلاص من المعاني الأساسية في العبادة، ومعناه أن يقصد الإنسان بعبادته رضا الله تعالى.</p><h2>دليل من القرآن</h2><p>قال الله تعالى: ﴿وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ﴾ [البينة: 5].</p><div class='source'>المصدر: القرآن الكريم، سورة البينة، الآية 5. المثال تعليمي ويُراجع قبل النشر.</div>"},
"demo-2":{title:"كيف يحافظ المسلم على الصلاة في وقتها؟",category:"الفقه والعبادات",summary:"وسائل عملية للمحافظة على الصلاة.",body:"<p>المحافظة على الصلاة تحتاج إلى عزم وأخذ بالأسباب، ومنها معرفة المواقيت الموثوقة والاستعداد للصلاة.</p>"},
"demo-3":{title:"كيف نتحقق من صحة حديث منتشر على الإنترنت؟",category:"الحديث النبوي وعلومه",summary:"التحقق من تخريج الحديث وحكم أهل الاختصاص.",body:"<p>الأفضل عدم نشر الحديث قبل التحقق من مصدره وحكم العلماء عليه.</p>"}
};
const $ = id => document.getElementById(id);
function fmtDate(d){try{const x=new Date(d);return x.toLocaleDateString("ar",{day:"numeric",month:"long",year:"numeric",calendar:"gregory"})+" م — "+x.toLocaleDateString("ar-SA-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"})}catch(e){return ""}}

const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function safeHtml(html) { return window.DOMPurify ? DOMPurify.sanitize(String(html || "")) : esc(html || ""); }
function setMeta(nameOrProperty, key, value) {
  let m = document.querySelector(`meta[${nameOrProperty}="${key}"]`);
  if (!m) { m = document.createElement("meta"); m.setAttribute(nameOrProperty,key); document.head.appendChild(m); }
  m.content = value || "";
}
(async () => {
  const id = new URLSearchParams(location.search).get("id");
  const cfg = window.SITE_CONFIG || {};
  const configured = !!(cfg.supabaseUrl && cfg.supabaseAnonKey &&
    cfg.supabaseAnonKey !== "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE" && window.supabase);
  let article = null, loadError = null;
  if (configured && id && !String(id).startsWith("demo-")) {
    try {
      const sb = window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
      const result = await sb.from("articles").select("id,title,category,summary,body,question_text,content_type,review_status,author,sources,video_url,published_at,status")
        .eq("id",id).eq("status","published").maybeSingle();
      article = result.data; loadError = result.error;
    } catch (e) { loadError = e; }
  } else if (!configured) article = demos[id] || null;
  if (!article) {
    $("title").textContent = "الموضوع غير موجود";
    $("body").textContent = loadError ? "تعذر تحميل الموضوع من قاعدة البيانات. حاول لاحقًا." : "قد يكون الرابط غير صحيح أو أن الموضوع غير منشور.";
    return;
  }
  document.title = article.title + " | ناصر بوطيب";
  $("title").textContent = article.title;
  const types = {article:"مقال",video:"مرئية",lesson:"درس",fatwa:"فتوى منقولة عن عالم",research:"بحث علمي",reply:"رد علمي"};
  $("meta").innerHTML = (/^\d+$/.test(String(article.id)) ? `<span class="num">رقم ${esc(article.id)}</span>` : "") +
    `<span class="pill">${esc(article.category)}</span>` +
    (types[article.content_type] ? `<span class="pill alt">${types[article.content_type]}</span>` : "") +
    (article.review_status === "reviewed" ? `<span class="pill">تمت المراجعة</span>` : "") +
    (article.author ? `<span>${esc(article.author)}</span>` : "") +
    (article.published_at ? `<span>${esc(fmtDate(article.published_at))}</span>` : "");
  let html = article.question_text ? `<div class="source"><strong>السؤال:</strong> ${esc(article.question_text)}</div>` : "";
  html += safeHtml(article.body || `<p>${esc(article.summary || "")}</p>`);
  if (article.sources) {
    html += "<h2>المصادر والمراجع</h2><ul class='sources'>" +
      String(article.sources).split(/\r?\n/).filter(x=>x.trim()).map(x=>`<li>${esc(x)}</li>`).join("") + "</ul>";
  }
  $("body").innerHTML = html;
  const videoUrl = String(article.video_url || "");
  if (/^https?:\/\//i.test(videoUrl)) {
    let embed = "";
    let match;
    if ((match = videoUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/))) {
      embed = `<iframe src="https://www.youtube-nocookie.com/embed/${match[1]}" allowfullscreen loading="lazy" title="فيديو المقال"></iframe>`;
    } else if ((match = videoUrl.match(/vimeo\.com\/(\d+)/))) {
      embed = `<iframe src="https://player.vimeo.com/video/${match[1]}" allowfullscreen loading="lazy" title="فيديو المقال"></iframe>`;
    } else if (/facebook\.com|fb\.watch/i.test(videoUrl)) {
      embed = `<iframe src="https://www.facebook.com/plugins/video.php?show_text=false&href=${encodeURIComponent(videoUrl)}" allowfullscreen loading="lazy" title="فيديو المقال"></iframe>`;
    } else {
      embed = `<video controls playsinline preload="metadata" src="${esc(videoUrl)}"></video>`;
    }
    $("body").insertAdjacentHTML("afterbegin",`<div class="video-box">${embed}</div>`);
  }
  setMeta("name","description",(article.summary || "").slice(0,160));
  setMeta("property","og:title",article.title);
  setMeta("property","og:description",(article.summary || "").slice(0,160));
  $("copyBtn").onclick = async () => {
    const text = article.title + "\n\n" + $("body").innerText;
    try { await navigator.clipboard.writeText(text); alert("تم النسخ"); }
    catch(e) { prompt("انسخ النص التالي:",text); }
  };
  $("shareBtn").onclick = async () => {
    try { if (navigator.share) await navigator.share({title:article.title,url:location.href}); else prompt("انسخ رابط الموضوع",location.href); }
    catch(e) {}
  };
  $("printBtn").onclick = () => window.print();
})();
</script></body></html>
